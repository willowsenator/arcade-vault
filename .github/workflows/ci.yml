name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Inert placeholders for the variables in .env.example: pull requests (Dependabot's included)
    # get no secrets, and nothing below contacts Supabase or Resend.
    env:
      NEXT_TELEMETRY_DISABLED: 1
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Compile only: the ISR pages prerender from live Supabase data, which CI does not have.
      - name: Build
        run: npx next build --experimental-build-mode=compile
      # After the build, which generates the route types (LayoutProps, PageProps) in .next/types.
      - name: Type-check
        run: npx tsc --noEmit
